      title: Lumen dimmable desk lamp - $160
      snippet: Dimmable LED, USB-C.
      keywords: [lamp, desk, led, dimmable]
    - url: https://shop-a.eval.test/products/LAMP-240
      title: Lumen Pro - $240
      snippet: Dimmable LED, wireless charging base.
      keywords: [lamp, desk, led, dimmable, pro]
